<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Natália & Fabiano convidam para a celebração do casamento. Toque no selo para abrir.">
<meta property="og:type" content="website">
<meta property="og:title" content="Convite Natália & Fabiano">
<meta property="og:description" content="Toque no selo para abrir o convite.">
<!-- Depois de publicar, troque pelo endereço completo da imagem, por exemplo https://SEUUSUARIO.github.io/convite/img/preview.jpg -->
<meta property="og:image" content="img/preview.jpg">
<title>Convite Natália & Fabiano</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap">
<style>
/* Layout: envelope fechado em duas folhas (esquerda maior, direita menor) que abrem para dentro, revelando o convite. */
:root {
  --ink: #101a35;
  --navy: #1d2c52;
  --gold: #bf8a2b;
  --stage-w: min(100vw, 480px);
  color-scheme: dark;
}
html, body { margin: 0; padding: 0; background: var(--ink); }
body { color: #f2e6c9; font-family: Georgia, "Times New Roman", serif; }

.wrap {
  position: relative;
  width: var(--stage-w);
  margin-inline: auto;
  height: 100svh;
  overflow: hidden;
  background: var(--navy);
  box-shadow: 0 0 60px rgba(0,0,0,.45);
}
.wrap.unlocked { height: auto; overflow: visible; }

.stage { position: relative; width: 100%; aspect-ratio: 1080 / 3000; }

.card { position: absolute; inset: 0; z-index: 0; background: var(--navy);
  transform-origin: 50% 20%; transform: scale(.9); opacity: .35;
  transition: transform 1.9s cubic-bezier(.2,.7,.2,1) .3s, opacity 1.4s ease .3s; }
.card { container-type: inline-size; }
.card > img { display: block; width: 100%; height: 100%; user-select: none; }
.quote { position: absolute; left: 17.6%; width: 64.8%; top: 4.667%; margin: 0; text-align: center;
  font-family: Marcellus, "Times New Roman", serif; font-size: 2.15cqw; line-height: 1.6;
  letter-spacing: .07em; text-transform: uppercase; color: var(--gold); }
.quote p { margin: 0; text-wrap: balance; }
.quote cite { display: block; font-style: normal; margin-top: .35em; }
.open .card { transform: none; opacity: 1; }

.links a {
  position: absolute; left: 11.65%; width: 76.6%; height: 3.65%;
  display: block; border-radius: 2px;
  transition: background .2s ease, box-shadow .2s ease;
}
.links a:hover { background: rgba(255,255,255,.12); }
.links a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.links a:active { background: rgba(0,0,0,.18); }
.links a:nth-child(1) { top: 76.90%; }
.links a:nth-child(2) { top: 81.25%; }
.links a:nth-child(3) { top: 85.76%; }
.links a:nth-child(4) { top: 90.22%; }

.env { position: absolute; inset: 0; z-index: 2;
  perspective: calc(var(--stage-w) * 2.4); perspective-origin: 50% 29%; overflow: hidden; }
.env.done { display: none; }
.door { position: absolute; top: 0; height: 100%; background: var(--navy);
  transition: transform 1.8s cubic-bezier(.62,.02,.22,1) .35s, opacity .5s ease 1.6s; }
.door-l { left: 0; width: 71.944%; transform-origin: left center; z-index: 3; }
.door-r { left: 71.944%; width: 28.056%; transform-origin: right center; z-index: 1; }
.open .door-l { transform: rotateY(106deg); opacity: 0; }
.open .door-r { transform: rotateY(-106deg); opacity: 0; }
.door img { position: absolute; display: block; user-select: none; pointer-events: none; }
.door-l img { left: 0; top: 28.667%; width: 77.99%; }
.door-r img { left: 55.78%; top: 28.667%; width: 44.22%; }

.shade { position: absolute; left: 40.741%; top: 0; width: 59.259%; height: 100%; z-index: 2;
  background: url(img/shadow.png) center / 100% 100% no-repeat; pointer-events: none;
  transition: opacity .5s ease; }
.open .shade { opacity: 0; }

.flowers { position: absolute; z-index: 5; left: 43.056%; top: 11.6%; width: 54.352%; pointer-events: none;
  transition: transform 1.1s cubic-bezier(.3,.7,.2,1), opacity .9s ease; }
.flowers img { display: block; width: 100%; transform-origin: 50% 100%; animation: sway 6s ease-in-out infinite; }
.open .flowers { transform: translateY(-9%) scale(1.06); opacity: 0; }

.seal { position: absolute; z-index: 6; left: 54.63%; top: 22.667%; width: 38.889%; padding: 0; border: 0;
  background: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform .6s cubic-bezier(.3,1.4,.5,1), opacity .5s ease .1s; }
.seal img { display: block; width: 100%; animation: breathe 3.2s ease-in-out infinite; transform-origin: 50% 40%; }
.seal:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 50%; }
.open .seal { transform: scale(1.18) rotate(-5deg); opacity: 0; pointer-events: none; }

@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
@keyframes sway { 0%,100% { transform: rotate(-.8deg); } 50% { transform: rotate(.8deg); } }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: #f2e6c9; color: var(--navy); font-size: 14px; letter-spacing: .04em;
  padding: 10px 18px; border-radius: 999px; transition: opacity .25s ease, transform .25s ease; z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .door, .card, .flowers, .seal, .shade { transition-duration: .01s !important; transition-delay: 0s !important; }
  .seal img, .flowers img { animation: none; }
}
</style>
</head>
<body>


<main class="wrap" id="wrap">
  <div class="stage" id="stage">
    <div class="card">
      <img src="img/card.jpg" width="1080" height="3000" alt="Natália e Fabiano convidam para a celebração do casamento, sábado, 20 de fevereiro de 2027, às 16h30, no Sunset Eventos, R. Pedro Albino Enzweiler, 550, Travessão, Dois Irmãos.">
      <blockquote class="quote">
        <p>“A suprema felicidade da vida consiste na convicção de que somos amados.”</p>
        <cite>Os Miseráveis, Victor Hugo</cite>
      </blockquote>
      <nav class="links" id="links" inert aria-label="Links do convite">
        <a href="https://www.google.com/maps/search/?api=1&query=Sunset+Eventos+R.+Pedro+Albino+Enzweiler+550+Travess%C3%A3o+Dois+Irm%C3%A3os+RS" target="_blank" rel="noopener" aria-label="Localização"></a>
        <a href="https://site.lejour.com.br/fabiano-e-natalia#confirmacao-de-presenca" target="_blank" rel="noopener" aria-label="Confirmar presença"></a>
        <a href="https://site.lejour.com.br/fabiano-e-natalia" target="_blank" rel="noopener" aria-label="Site dos noivos"></a>
        <a href="https://site.lejour.com.br/fabiano-e-natalia#lista-de-presentes" target="_blank" rel="noopener" aria-label="Lista de presente"></a>
      </nav>
    </div>

    <div class="env" id="env">
      <div class="door door-r"><img src="img/twine-r.png" alt=""></div>
      <div class="shade"></div>
      <div class="door door-l"><img src="img/twine-l.png" alt=""></div>
      <div class="flowers"><img src="img/flowers.png" alt=""></div>
      <button class="seal" id="seal" type="button" aria-label="Abrir convite"><img src="img/seal.png" alt=""></button>
    </div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var wrap = document.getElementById('wrap');
  var stage = document.getElementById('stage');
  var env = document.getElementById('env');
  var links = document.getElementById('links');
  var toast = document.getElementById('toast');
  var opened = false;

  function openInvite() {
    if (opened) return;
    opened = true;
    wrap.classList.add('unlocked');
    stage.classList.add('open');
    links.removeAttribute('inert');
    setTimeout(function () { env.classList.add('done'); }, 2800);
  }
  env.addEventListener('click', openInvite);

  var t;
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(t);
    t = setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }
  links.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-soon]');
    if (a && a.getAttribute('href') === '#') { e.preventDefault(); say('Este link será liberado em breve.'); }
  });
})();
</script>

</body>
</html>
